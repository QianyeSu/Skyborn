name: Build and publish pure-Python wheel

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_dist:
    name: Build pure-Python wheel and sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build pure-Python wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          ls -lh dist/
          test -f dist/skyborn-*-py3-none-any.whl
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Verify pure-Python wheel contents
        run: |
          python -B -c '
          import glob, zipfile
          whl = glob.glob("dist/skyborn-*-py3-none-any.whl")[0]
          with zipfile.ZipFile(whl) as zf:
              compiled = [n for n in zf.namelist() if n.endswith((".so", ".pyd", ".dylib", ".f90", ".c", ".pyx"))]
          assert not compiled, f"Unexpected compiled files in pure wheel: {compiled}"
          print("Verified pure-Python wheel:", whl)
          '

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: skyborn-dist
          path: dist/*

  test_install:
    name: Test wheel installation on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: [build_dist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        python: ["3.10", "3.12", "3.14"]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: skyborn-dist
          path: dist

      - name: Install pure-Python wheel without compiling
        run: |
          WHEEL=$(python -c "import glob; print(glob.glob('dist/skyborn-*-py3-none-any.whl')[0])")
          python -m pip install --no-deps "$WHEEL"
          python -B -c "import skyborn; print('skyborn pure wheel import passed:', skyborn.__version__)"

  publish:
    name: Publish to GitHub Release & PyPI
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'release' && github.event.action == 'published')
    needs: [build_dist, test_install]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: skyborn-dist
          path: dist

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          RELEASE_DATE="$(LC_ALL=C date '+%b %d, %Y' | sed 's/^Sep /Sept /')"
          : > release_body.md
          if [ -f "docs/source/changelog.rst" ]; then
            sed -n "/Version ${VERSION_NUM}/,/Version [0-9]/p" docs/source/changelog.rst | head -n -1 >> release_body.md || true
          fi
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "**Installation:**" >> release_body.md
          echo '```bash' >> release_body.md
          echo "pip install --upgrade skyborn==${VERSION_NUM}" >> release_body.md
          echo '```' >> release_body.md
          sed -i -E 's/^(Version [0-9]+\.[0-9]+\.[0-9]+) \(Current\)$/\1/' release_body.md
          echo "RELEASE_DATE=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} (${{ steps.release_notes.outputs.RELEASE_DATE || env.RELEASE_DATE }})
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: release_body.md
          files: dist/*
          overwrite_files: true
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

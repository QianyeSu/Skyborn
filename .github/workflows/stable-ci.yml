name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install system toolchain (for optional git fallback builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran pkg-config

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and Skyborn
        run: |
          python -m pip install --upgrade pip setuptools wheel meson ninja "cython>=3.0.0" numpy
          pip install skyborn-plot skyborn-spharm skyborn-backend || {
            pip install --no-build-isolation \
              git+https://github.com/skyborn-org/skyborn-plot.git \
              git+https://github.com/skyborn-org/skyborn-spharm.git \
              git+https://github.com/skyborn-org/skyborn-backend.git
          }
          pip install -r requirements/base.txt --no-deps || true
          pip install pandas xarray matplotlib netCDF4 metpy tqdm statsmodels scipy scikit-learn dask
          pip install --no-deps -e .

      - name: Run unit tests
        run: pytest -o addopts= -p no:cacheprovider -q

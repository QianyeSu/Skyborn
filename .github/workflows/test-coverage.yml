name: Test Coverage and Quality

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/test-coverage.yml"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system toolchain (for optional git fallback builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran pkg-config libeccodes-dev || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel meson ninja "cython>=3.0.0" numpy
          pip install skyborn-plot skyborn-spharm skyborn-backend || {
            pip install --no-build-isolation \
              git+https://github.com/skyborn-org/skyborn-plot.git \
              git+https://github.com/skyborn-org/skyborn-spharm.git \
              git+https://github.com/skyborn-org/skyborn-backend.git
          }
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
          pip install pytest-xdist coverage[toml]

      - name: Run tests with coverage
        id: run_tests_with_coverage
        run: |
          set +e
          python -B -m pytest tests/ --ignore=tests/test_gradients.py -k "not test_vorticity_with_metpy_crs" \
            --cov=src/skyborn \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=15 \
            -v --tb=short 2>&1 | tee pytest-coverage.log
          pytest_exit=${PIPESTATUS[0]}
          set -e
          echo "pytest exit code: $pytest_exit"
          exit $pytest_exit

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: skyborn-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            pytest-coverage.log
        continue-on-error: true

  docs:
    name: Documentation Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          SKYBORN_DOCS_BUILD=1 pip install -e . --no-deps
          pip install -r requirements/docs.txt || pip install sphinx myst-nb sphinx-copybutton furo toml

      - name: Test documentation build
        run: |
          cd docs
          SKYBORN_DOCS_BUILD=1 sphinx-build -b html source build/html --quiet

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build/html/
